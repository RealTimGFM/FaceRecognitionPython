databases:
  - name: facerecog-db
    plan: free

services:
  - type: web
    name: facerecog-web
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: TASK_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
