name: Scheduled Cleanup

on:
  schedule:
    - cron: "15 6 * * *" # daily 06:15 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Call cleanup endpoint
        env:
          CLEANUP_URL: https://facerecog-web.onrender.com/tasks/cleanup
          TASK_TOKEN: ${{ secrets.TASK_TOKEN }}
        run: |
          if [ -z "$TASK_TOKEN" ]; then
            echo "Missing secret: TASK_TOKEN"
            exit 1
          fi
          curl -fsSL -X POST "$CLEANUP_URL" -H "X-Task-Token: $TASK_TOKEN"
