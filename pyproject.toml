[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facerecog-web"
version = "0.1.0"
description = "Face recognition Flask web app (FaceID v2 modules)"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["faceid*"]
