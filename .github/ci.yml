name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC (weekly sanity run)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: System deps (safe defaults for common Python wheels)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Sanity checks (no DB required)
        run: |
          python -m py_compile app.py
          python -m compileall -q .
          python -m pip check

      - name: Run pytest (only if tests exist)
        shell: bash
        run: |
          set -e
          if [ -d "tests" ] || find . -maxdepth 4 -name "test_*.py" | grep -q .; then
            pytest -q
          else
            echo "No pytest tests detected; skipping."
          fi
