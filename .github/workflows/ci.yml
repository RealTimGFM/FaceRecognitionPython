name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
          pip install -e .

      - name: Lint (ruff critical-only)
        run: |
          ruff check . --select=E9,F63,F7,F82

      - name: Run tests
        run: |
          pytest -q

  dependency_review:
    runs-on: ubuntu-latest
    # This job only makes sense on PRs
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  gate:
    runs-on: ubuntu-latest
    needs: [tests, dependency_review, codeql]
    # Always run so it reports a single status; fail if any dependency failed/skipped unexpectedly
    if: always()
    steps:
      - name: Evaluate results
        run: |
          echo "tests: ${{ needs.tests.result }}"
          echo "dependency_review: ${{ needs.dependency_review.result }}"
          echo "codeql: ${{ needs.codeql.result }}"

          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "tests failed"
            exit 1
          fi

          # dependency_review is PR-only; on push it will be skipped and that's OK
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.dependency_review.result }}" != "success" ]; then
            echo "dependency_review failed on PR"
            exit 1
          fi

          if [ "${{ needs.codeql.result }}" != "success" ]; then
            echo "codeql failed"
            exit 1
          fi

          echo "All required checks passed."
