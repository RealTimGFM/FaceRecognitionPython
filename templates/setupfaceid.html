{% extends "base.html" %}
{% block content %}
<section class="card">
  <div class="header">
    <div class="title">Setup Face ID</div>
    <span class="muted">Capture 3–5 samples in good lighting</span>
  </div>

  <div class="media wide">
    <video id="video" class="video" autoplay playsinline></video>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <div class="row mt-12">
    <button id="btnStart" class="btn">Start Camera</button>
    <button id="btnCapture" class="btn btn-primary" disabled>Capture Sample</button>
    <button id="btnSave" class="btn" disabled>Save Face ID</button>
    <div class="row between mt-12">
      <div class="muted">Samples: <span id="samplesCount">0</span>/3</div>
      <div class="progress" aria-label="Enrollment progress">
        <div id="samplesBar" class="bar"></div>
      </div>
    </div>

  </div>

  <p id="status" class="muted mt-10">.Loading models…</p>
</section>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');

  const btnStart = document.getElementById('btnStart');
  const btnCapture = document.getElementById('btnCapture');
  const btnSave = document.getElementById('btnSave');
  const statusEl = document.getElementById('status');

  let samples = [];
  const MIN_SAMPLES = 3;
  const samplesCountEl = document.getElementById("samplesCount");
  const samplesBarEl = document.getElementById("samplesBar");

  function updateProgress() {
    const n = samples.length;
    if (samplesCountEl) samplesCountEl.textContent = String(n);
    if (samplesBarEl) samplesBarEl.style.width = `${Math.min(100, (n / MIN_SAMPLES) * 100)}%`;
  }
  updateProgress();

  function setStatus(msg) { statusEl.textContent = msg; }

  async function loadModels() {
    const base = '/static/models';
    await faceapi.nets.tinyFaceDetector.loadFromUri(base);
    await faceapi.nets.faceLandmark68Net.loadFromUri(base);
    await faceapi.nets.faceRecognitionNet.loadFromUri(base);
  }

  async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    video.srcObject = stream;
    await video.play();
  }

  async function captureDescriptor() {
    const opts = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });
    const det = await faceapi
      .detectSingleFace(video, opts)
      .withFaceLandmarks()
      .withFaceDescriptor();

    if (!det) return null;
    return Array.from(det.descriptor);
  }

  function captureImageDataUrl() {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    return canvas.toDataURL('image/png');
  }

  (async () => {
    try {
      await loadModels();
      setStatus('Models loaded. Click “Start Camera”.');
    } catch (e) {
      setStatus('Error loading models. Make sure /static/models exists.');
    }
  })();

  btnStart.addEventListener('click', async () => {
    try {
      await startCamera();
      samples = [];
      btnCapture.disabled = false;
      btnSave.disabled = true;
      setStatus('Camera started. Capture at least 3 samples.');
    } catch (e) {
      setStatus('Camera permission denied or unavailable.');
    }
  });

  btnCapture.addEventListener('click', async () => {
    const d = await captureDescriptor();
    if (!d) {
      setStatus('No face detected. Center your face and try again.');
      return;
    }

    samples.push(d);
    updateProgress();

    if (samples.length >= 3) {
      btnSave.disabled = false;
      setStatus(`Captured sample ${samples.length}. Ready to save.`);
    } else {
      setStatus(`Captured sample ${samples.length}. Need at least 3.`);
    }
  });

  btnSave.addEventListener('click', async () => {
    if (samples.length < 3) {
      setStatus('Need at least 3 samples before saving.');
      return;
    }

    const image = captureImageDataUrl();

    setStatus('Saving…');
    const res = await fetch('{{ url_for("setupfaceid") }}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image, embeddings: samples })
    });

    const j = await res.json();
    if (res.ok && j.ok) {
      setStatus('Saved. Redirecting…');
      window.location.href = '{{ url_for("index") }}';
      return;
    }

    setStatus('Error: ' + (j.error || 'unknown'));
  });
</script>

{% endblock %}
